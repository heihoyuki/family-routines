<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Family Routines">
<title>Family Routines ✨</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#F0F4FF;--white:#FFFFFF;--text:#1A1A2E;--soft:#6B7280;
  --border:#E5E7EB;--r:18px;--rs:12px;--rl:26px;
  --sh:0 2px 10px rgba(0,0,0,.07);--sh2:0 4px 20px rgba(0,0,0,.10);
  --tr:all .18s ease;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;}
#app{max-width:480px;min-height:100vh;margin:0 auto;position:relative;}
.screen{display:none;flex-direction:column;min-height:100vh;background:var(--bg);}
.screen.active{display:flex;animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* HEADER */
.hdr{padding:52px 18px 12px;display:flex;align-items:center;gap:10px;}
.hdr-info{flex:1;}
.hdr-info h1{font-size:22px;font-weight:800;letter-spacing:-.4px;}
.hdr-info p{font-size:12px;color:var(--soft);margin-top:2px;}
.ico-btn{width:44px;height:44px;border-radius:50%;background:var(--white);border:none;
  display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;
  box-shadow:var(--sh);transition:var(--tr);flex-shrink:0;}
.ico-btn:active{transform:scale(.92);}

/* CONTENT */
.cnt{flex:1;padding:6px 16px 32px;overflow-y:auto;}

/* ── HOME ── */
.hero{background:linear-gradient(135deg,#667eea,#764ba2);border-radius:var(--r);
  padding:20px;color:#fff;margin-bottom:18px;}
.hero .dt{font-size:12px;opacity:.8;font-weight:500;}
.hero .gr{font-size:22px;font-weight:800;margin-top:3px;letter-spacing:-.4px;}
.hero .sb{display:inline-block;background:rgba(255,255,255,.22);border-radius:20px;
  padding:4px 13px;font-size:12px;font-weight:600;margin-top:10px;}
.sec-ttl{font-size:11px;font-weight:700;color:var(--soft);text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:9px;}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.mcard{border-radius:var(--r);padding:16px 14px;display:flex;flex-direction:column;
  align-items:flex-start;gap:5px;cursor:pointer;transition:var(--tr);border:none;
  position:relative;overflow:hidden;min-height:110px;}
.mcard:active{transform:scale(.96);}
.mcard .em{font-size:34px;line-height:1;}
.mcard .nm{font-size:16px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.15);}
.mcard .pt{font-size:11px;color:rgba(255,255,255,.85);font-weight:500;}
.mcard .pbar{position:absolute;bottom:0;left:0;height:4px;background:rgba(255,255,255,.4);transition:width .5s ease;}
.mbadge{position:absolute;top:10px;right:10px;font-size:19px;}
.par-btn{margin-top:18px;width:100%;padding:15px;border-radius:var(--r);background:var(--white);
  border:2px dashed var(--border);font-size:15px;font-weight:600;color:var(--soft);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:var(--tr);}
.par-btn:active{opacity:.7;}

/* ── ROUTINE ── */
.rminfo{display:flex;align-items:center;gap:12px;padding:12px 18px 16px;}
.rem{font-size:42px;width:60px;height:60px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;flex-shrink:0;}
.rnm{font-size:24px;font-weight:800;letter-spacing:-.4px;}
.rdt{font-size:12px;color:var(--soft);}
.prog-wrap{margin:0 18px 14px;background:var(--white);border-radius:var(--r);
  padding:13px 15px;box-shadow:var(--sh);}
.prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.prog-lbl{font-size:12px;font-weight:600;}
.prog-pct{font-size:12px;color:var(--soft);}
.prog-track{height:7px;background:var(--border);border-radius:4px;overflow:hidden;}
.prog-fill{height:100%;border-radius:4px;transition:width .5s ease;}
.tabs{display:flex;gap:7px;padding:0 18px 14px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:7px 16px;border-radius:20px;font-size:13px;font-weight:600;border:none;cursor:pointer;
  transition:var(--tr);white-space:nowrap;background:var(--white);color:var(--soft);box-shadow:var(--sh);}
.tab.on{color:#fff;}
.tlist{display:flex;flex-direction:column;gap:7px;}
.ti{background:var(--white);border-radius:var(--rs);padding:13px 15px;display:flex;
  align-items:center;gap:12px;box-shadow:var(--sh);cursor:pointer;transition:var(--tr);
  border:2px solid transparent;}
.ti:active{transform:scale(.99);}
.ti.done{opacity:.6;}
.tck{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--border);display:flex;
  align-items:center;justify-content:center;flex-shrink:0;transition:var(--tr);font-size:13px;}
.ti.done .tck{border-color:transparent;}
.tem{font-size:20px;flex-shrink:0;}
.ttx{flex:1;font-size:14px;font-weight:500;}
.ti.done .ttx{text-decoration:line-through;}
/* young child grid */
.ygrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.yti{background:var(--white);border-radius:var(--r);padding:18px 10px;display:flex;
  flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:var(--tr);
  box-shadow:var(--sh);border:3px solid transparent;min-height:110px;}
.yti:active{transform:scale(.95);}
.yti.done{border-color:#4CAF50;background:#F1F8E9;}
.yem{font-size:40px;line-height:1;}
.ytx{font-size:12px;font-weight:600;text-align:center;}
/* all done banner */
.adbanner{border-radius:var(--r);padding:15px 18px;color:#fff;text-align:center;margin-bottom:14px;}
.adbanner .t{font-size:17px;font-weight:800;}
.adbanner .s{font-size:12px;opacity:.85;margin-top:3px;}
/* empty */
.empty{text-align:center;padding:36px 20px;color:var(--soft);}
.empty .eico{font-size:44px;margin-bottom:10px;}
.empty p{font-size:14px;line-height:1.5;}
/* baby */
.baby{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:40px 20px;text-align:center;flex:1;}
.baby .bi{font-size:72px;}
.baby .bt{font-size:18px;font-weight:700;}
.baby .bs{font-size:14px;color:var(--soft);line-height:1.6;}

/* ── AUTH ── */
.auth{display:flex;flex-direction:column;align-items:center;justify-content:center;
  flex:1;padding:40px 24px;gap:20px;}
.auth .ai{font-size:60px;}
.auth .at{font-size:22px;font-weight:800;}
.auth .as{font-size:13px;color:var(--soft);text-align:center;}
.pw-input{width:100%;padding:15px 18px;border-radius:var(--r);border:2px solid var(--border);
  font-size:17px;text-align:center;outline:none;transition:var(--tr);font-family:inherit;}
.pw-input:focus{border-color:#667eea;}
.auth-err{color:#E53E3E;font-size:13px;font-weight:500;}
.btn-pri{width:100%;padding:15px;border-radius:var(--r);
  background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:15px;
  font-weight:700;border:none;cursor:pointer;transition:var(--tr);}
.btn-pri:active{opacity:.9;transform:scale(.99);}

/* ── DASHBOARD ── */
.dcard{background:var(--white);border-radius:var(--r);padding:14px;margin-bottom:9px;
  box-shadow:var(--sh);display:flex;align-items:center;gap:11px;cursor:pointer;transition:var(--tr);}
.dcard:active{transform:scale(.99);}
.dcard .de{font-size:30px;}
.dcard .di{flex:1;}
.dcard .dn{font-size:15px;font-weight:700;}
.dcard .ds{font-size:12px;color:var(--soft);margin-top:2px;}
.badge{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:600;}
.b-done{background:#E8F5E9;color:#2E7D32;}
.b-prog{background:#FFF9C4;color:#B45309;}
.b-nil{background:#F3F4F6;color:#6B7280;}
.b-ex{background:#EDE9FE;color:#5B21B6;}

/* ── ADMIN ── */
.asec{background:var(--white);border-radius:var(--r);padding:15px;margin-bottom:11px;box-shadow:var(--sh);}
.assttl{font-size:11px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.8px;margin-bottom:11px;}
.tai{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--border);}
.tai:last-child{border-bottom:none;}
.taem{font-size:18px;}
.tatx{flex:1;font-size:13px;font-weight:500;}
.btn-sm{padding:5px 11px;border-radius:8px;font-size:11px;font-weight:600;border:none;cursor:pointer;transition:var(--tr);}
.btn-del{background:#FEE2E2;color:#C53030;}
.btn-del:active{background:#FCA5A5;}
.atf{display:flex;gap:7px;margin-top:11px;}
.tinput{padding:9px 13px;border-radius:var(--rs);border:2px solid var(--border);font-size:13px;
  outline:none;font-family:inherit;transition:var(--tr);}
.tinput:focus{border-color:#667eea;}
.btn-add{padding:9px 14px;border-radius:var(--rs);background:#667eea;color:#fff;
  font-size:13px;font-weight:700;border:none;cursor:pointer;white-space:nowrap;}
.slotopts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px;}
.sopt{padding:6px 13px;border-radius:20px;font-size:12px;font-weight:600;
  border:2px solid var(--border);background:var(--white);cursor:pointer;color:var(--soft);transition:var(--tr);}
.sopt.on{background:#667eea;color:#fff;border-color:#667eea;}
/* toggle */
.tog-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;}
.tog-lbl{font-size:13px;font-weight:600;}
.tog-sub{font-size:11px;color:var(--soft);margin-top:2px;}
.tog{width:48px;height:26px;background:var(--border);border-radius:13px;position:relative;
  cursor:pointer;transition:var(--tr);border:none;flex-shrink:0;}
.tog.on{background:#4CAF50;}
.tog::after{content:'';position:absolute;width:20px;height:20px;background:#fff;
  border-radius:50%;top:3px;left:3px;transition:var(--tr);box-shadow:0 1px 4px rgba(0,0,0,.2);}
.tog.on::after{left:25px;}

/* ── SETTINGS ── */
.sitem{display:flex;align-items:center;gap:12px;padding:13px 0;
  border-bottom:1px solid var(--border);cursor:pointer;}
.sitem:last-child{border-bottom:none;}
.sico{width:38px;height:38px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.sinf{flex:1;}
.snm{font-size:14px;font-weight:600;}
.ssb{font-size:11px;color:var(--soft);margin-top:2px;}
.sarr{color:var(--soft);font-size:17px;}

/* ── DISHES ── */
.drow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.drow:last-child{border-bottom:none;}
.dday{font-size:13px;font-weight:700;width:75px;flex-shrink:0;}
.dperson{flex:1;font-size:13px;color:var(--soft);}
.dsel{flex:1;padding:6px 10px;border-radius:var(--rs);border:2px solid var(--border);
  font-size:12px;outline:none;font-family:inherit;}

/* ── CELEBRATION ── */
.cel-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;
  flex-direction:column;align-items:center;justify-content:center;z-index:999;animation:fadeIn .25s ease;}
.cel-card{background:#fff;border-radius:var(--rl);padding:36px 28px;text-align:center;
  max-width:290px;animation:popIn .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes popIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.cel-em{font-size:60px;}
.cel-t{font-size:22px;font-weight:800;margin-top:10px;}
.cel-s{font-size:14px;color:var(--soft);margin-top:7px;line-height:1.5;}
.confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:998;}

/* ── MODAL ── */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;
  align-items:flex-end;z-index:500;animation:fadeIn .2s ease;}
.modal{background:#fff;border-radius:var(--rl) var(--rl) 0 0;padding:22px 18px 38px;
  width:100%;animation:slideUp .3s cubic-bezier(.32,.72,0,1);}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mhandle{width:38px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px;}
.mttl{font-size:19px;font-weight:800;margin-bottom:14px;}

/* ── WALLET PIN ── */
.pin-dots{display:flex;gap:14px;justify-content:center;margin:22px 0 26px;}
.pin-dot{width:16px;height:16px;border-radius:50%;background:var(--border);transition:var(--tr);}
.pin-dot.filled{background:#667eea;}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:240px;margin:0 auto;}
.pin-key{width:72px;height:72px;border-radius:50%;background:var(--white);border:none;
  font-size:24px;font-weight:700;cursor:pointer;box-shadow:var(--sh);transition:var(--tr);
  display:flex;align-items:center;justify-content:center;}
.pin-key:active{transform:scale(.9);background:var(--bg);}
.pin-key.ghost{background:transparent;box-shadow:none;cursor:default;}
.pin-err{color:#E53E3E;font-size:13px;font-weight:600;height:18px;text-align:center;}
.pin-link{background:none;border:none;color:var(--soft);font-size:13px;cursor:pointer;padding:8px;}
/* ── MEMBER FORM ── */
.emo-grid{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
.col-grid{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
.emo-btn{width:44px;height:44px;border-radius:50%;background:var(--border);border:none;
  font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--tr);}
.col-btn{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:var(--tr);}
.col-btn.sel{border-color:#111;transform:scale(1.15);}
.emo-btn.sel{background:#667eea;outline:3px solid #667eea;}
</style>
</head>

<script>
// ═══════════════════════════════════════════════
//  FAMILY ROUTINES  —  Phase 1
// ═══════════════════════════════════════════════

// ── DEFAULT DATA ────────────────────────────────

      {id:'ye6',text:'Put away worn clothes',emoji:'👚'},

  },

const EMPTY_TASKS = {
  weekday:{morning:[],evening:[]},
  weekend:{morning:[],noon:[],evening:[]}
};

const INITIAL_MEMBERS = [
  {id:'zaion', name:'ざいおん', emoji:'🏆',color:'#27AE60',age:9},
  {id:'reima', name:'れいま', emoji:'🐧',color:'#D35400',age:11},

// ── STORAGE ──────────────────────────────────────

// ── INIT ─────────────────────────────────────────

function clone(o){return JSON.parse(JSON.stringify(o));}
function uid(){return 't'+Date.now()+Math.random().toString(36).slice(2,6);}

function buildDefault(){
  const tasks={};
  INITIAL_MEMBERS.forEach(m=>{
    tasks[m.id]=m.isBaby?clone(EMPTY_TASKS):m.isYoung?clone(YOUNG_DEFAULTS):
      (m.isParent?clone(EMPTY_TASKS):clone(TASK_DEFAULTS));
  });
  // Charge device: only for れいま and ざいおん (school tablets)

// ── HELPERS ──────────────────────────────────────

function today(){return new Date().toISOString().slice(0,10);}
function dayType(){const d=new Date().getDay();return(d===0||d===6)?'weekend':'weekday';}
function dow(){return String(new Date().getDay());}
function curSlot(){const h=new Date().getHours();return h<12?'morning':h<17?'noon':'evening';}
function fmtDate(d){
  const ds=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const ms=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${ds[d.getDay()]}, ${ms[d.getMonth()]} ${d.getDate()}`;
}
function slotLabel(s){return{morning:'🌅 Morning',noon:'☀️ Noon',evening:'🌙 Evening'}[s]||s;}

function memberTasks(mid,dt,slot){
  const m=D.members.find(x=>x.id===mid);
  if(!m||!D.tasks[mid])return[];
  const base=clone((D.tasks[mid][dt]||{})[slot]||[]);
  // auto-add dishes duty in evening
  if(slot==='evening'){
    const assigned=(D.dishes[dow()]||[]);
    if(assigned.includes(mid)&&!base.some(t=>t.isDishes)){
      base.push({id:'dishes_'+dow(),text:'Wash dishes',emoji:'🍽️',isDishes:true});
    }
  }
  return base;
}

function getComp(mid,slot){
  const c=DB.getC();const t=today();
  return((c[t]||{})[mid]||{})[slot]||[];
}

function toggleComp(mid,slot,tid){
  const c=DB.getC();const t=today();
  if(!c[t])c[t]={};
  if(!c[t][mid])c[t][mid]={};
  if(!c[t][mid][slot])c[t][mid][slot]=[];
  const a=c[t][mid][slot],i=a.indexOf(tid);
  i>=0?a.splice(i,1):a.push(tid);
  DB.saveC(c);
  return a.includes(tid);
}

function todayProg(mid){
  const dt=dayType();
  const slots=dt==='weekday'?['morning','evening']:['morning','noon','evening'];
  let total=0,done=0;
  slots.forEach(s=>{
    const tasks=memberTasks(mid,dt,s);
    total+=tasks.length;
    done+=getComp(mid,s).length;
  });
  return{total,done,pct:total>0?Math.round(done/total*100):0};
}

function isExcused(mid){
  const e=DB.getE();return((e[today()])||[]).includes(mid);
}

function toggleExcused(mid){
  const e=DB.getE();const t=today();
  if(!e[t])e[t]=[];
  const i=e[t].indexOf(mid);i>=0?e[t].splice(i,1):e[t].push(mid);
  DB.saveE(e);
}

const DB_A={
  KA:'fr_allow_v1',KS:'fr_streak_v1',
  get(){const r=localStorage.getItem(this.KA);return r?JSON.parse(r):{};},
  save(d){localStorage.setItem(this.KA,JSON.stringify(d));},
  getS(){const r=localStorage.getItem(this.KS);return r?JSON.parse(r):{};},
  saveS(s){localStorage.setItem(this.KS,JSON.stringify(s));}
};

function ewallet(){return{balance:0,debt:0,debtRatio:0.5,transactions:[],goal:null};}

function addTx(mid,currency,type,amount,note){
  const a=DB_A.get();
  if(!a[mid])a[mid]={aud:ewallet(),jpy:ewallet()};
  if(!a[mid][currency])a[mid][currency]=ewallet();
  const w=a[mid][currency];
  const isIn=amount>0;
  let amt=amount;
  if(isIn&&w.debt>0){
    const rep=Math.min(w.debt,amount*w.debtRatio);
    w.debt=Math.max(0,w.debt-rep);
    w.transactions.unshift({id:uid(),date:today(),type:'debt_repay',amount:-rep,note:`Debt repay (${(w.debtRatio*100).toFixed(0)}%)`});
    amt=amount-rep;
  }
  w.balance+=amt;
  if(w.balance<0){w.debt+=Math.abs(w.balance);w.balance=0;}
  w.transactions.unshift({id:uid(),date:today(),type,amount:amt,note:note||''});
  DB_A.save(a);
  if(isIn&&w.goal&&w.balance>=w.goal.amount)return'goal_reached';
  return null;
}

function fmtAmt(amount,currency){
  const abs=Math.abs(amount);
  return currency==='aud'?`$${abs.toFixed(2)}`:`¥${Math.round(abs).toLocaleString()}`;
}

function txLabel(type){
  return{deposit:'💰 Deposit',withdrawal:'💸 Withdrawal',penalty:'⚠️ Penalty',
    interest:'📈 5% Interest',streak_bonus:'🔥 Streak Bonus',event_bonus:'🏆 Event Bonus',
    jp_bonus:'🎌 Japanese Level',debt_repay:'📉 Debt Repay',debt:'🔴 Debt Added'}[type]||type;
}

function getWeekKey(d){
  const date=d||new Date();
  const y=date.getFullYear();
  const start=new Date(y,0,1);
  const wk=Math.ceil((((date-start)/86400000)+start.getDay()+1)/7);
  return`${y}-W${String(wk).padStart(2,'0')}`;
}

function prevWeekKey(wk){
  const[y,w]=wk.split('-W').map(Number);
  if(w===1)return`${y-1}-W52`;
  return`${y}-W${String(w-1).padStart(2,'0')}`;
}

function streakBonus(n){return n<=1?0.50:n-1;}

function getStreak(mid){
  const s=DB_A.getS();
  if(!s[mid])s[mid]={count:0,lastConfirmedWeek:null};
  return s[mid];
}

function confirmWeek(mid){
  const s=DB_A.getS();
  if(!s[mid])s[mid]={count:0,lastConfirmedWeek:null};
  const wk=getWeekKey();
  const st=s[mid];
  const newCount=st.lastConfirmedWeek===prevWeekKey(wk)||st.lastConfirmedWeek===wk?
    (st.lastConfirmedWeek===wk?st.count:st.count+1):1;
  st.count=newCount;st.lastConfirmedWeek=wk;
  DB_A.saveS(s);
  const bonus=streakBonus(newCount);
  addTx(mid,'aud','streak_bonus',bonus,`Week ${newCount} streak`);
  return{count:newCount,bonus};
}

function thisWeekDays(mid){
  const now=new Date(),dow=now.getDay();
  const mon=new Date(now);
  mon.setDate(now.getDate()-(dow===0?6:dow-1));mon.setHours(0,0,0,0);
  const result=[];
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    const ds=d.toISOString().slice(0,10);
    const dayLbl=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
    if(d>now){result.push({day:dayLbl,status:'future'});continue;}
    const isWe=d.getDay()===0||d.getDay()===6;
    const dt=isWe?'weekend':'weekday';
    const slots=isWe?['morning','noon','evening']:['morning','evening'];
    const comps=DB.getC();
    const dc=((comps[ds]||{})[mid])||{};
    const exc=((DB.getE()[ds])||[]).includes(mid);
    if(exc){result.push({day:dayLbl,status:'excused'});continue;}
    let ok=true;
    for(const sl of slots){
      const tasks=memberTasks(mid,dt,sl);
      if(tasks.length>0&&(dc[sl]||[]).length<tasks.length){ok=false;break;}
    }
    result.push({day:dayLbl,status:ok?'done':'miss'});
  }
  return result;
}

function isWeekConfirmable(mid){
  const days=thisWeekDays(mid);
  const st=getStreak(mid);
  if(st.lastConfirmedWeek===getWeekKey())return false;
  return days.filter(d=>d.status!=='future').every(d=>d.status==='done'||d.status==='excused');
}

// ── EVENT DELEGATION ──────────────────────────────

function handleClick(e){
  const el=e.target.closest('[data-a]');
  if(!el)return;
  const a=el.dataset.a;

  if(a==='open'){
    S.slot=curSlot();
    go('routine',{mid:el.dataset.m});
  }
  else if(a==='back'){
    if(S.screen==='walletLock'){pinBuf='';pinError='';go('routine',{mid:S.walletLockFor});}
    else go('home');
  }
  else if(a==='parent'){S.authed?go('dashboard'):go('login');}
  else if(a==='login'){
    const pw=document.getElementById('pw');
    const err=document.getElementById('pw-err');
    if(pw&&pw.value===D.settings.pw){S.authed=true;go('dashboard');}
    else{if(err)err.style.display='block';if(pw){pw.value='';pw.focus();}}
  }
  else if(a==='slot'){go('routine',{slot:el.dataset.s});}
  else if(a==='check'){
    const tid=el.dataset.t;
    const wasAdded=toggleComp(S.mid,S.slot,tid);
    const tasks=memberTasks(S.mid,dayType(),S.slot);
    const comp=getComp(S.mid,S.slot);
    const allDone=tasks.length>0&&tasks.every(t=>comp.includes(t.id));
    render();
    if(allDone&&wasAdded)celebrate(S.mid);
  }
  else if(a==='todash'){go('dashboard');}
  else if(a==='tosettings'){go('settings');}
  else if(a==='settings'){go('settings');}
  else if(a==='adminm'){go('adminmember',{adminMid:el.dataset.m,adminSlot:'weekday_morning'});}
  else if(a==='aslot'){go('adminmember',{adminSlot:el.dataset.s});}
  else if(a==='addtask'){
    const txt=document.getElementById('ntxt')?.value.trim();
    if(!txt)return;
    const emo=document.getElementById('nemo')?.value.trim()||'📌';
    const[dt,sl]=S.adminSlot.split('_');
    if(!D.tasks[S.adminMid])D.tasks[S.adminMid]=clone(TASK_DEFAULTS);
    if(!D.tasks[S.adminMid][dt])D.tasks[S.adminMid][dt]={};
    if(!D.tasks[S.adminMid][dt][sl])D.tasks[S.adminMid][dt][sl]=[];
    D.tasks[S.adminMid][dt][sl].push({id:uid(),text:txt,emoji:emo});
    DB.save(D);render();
  }
  else if(a==='deltask'){
    const i=parseInt(el.dataset.i);
    const[dt,sl]=S.adminSlot.split('_');
    if(D.tasks[S.adminMid]&&D.tasks[S.adminMid][dt]&&D.tasks[S.adminMid][dt][sl]){
      D.tasks[S.adminMid][dt][sl].splice(i,1);
      DB.save(D);render();
    }
  }
  else if(a==='excused'){toggleExcused(S.adminMid);render();}
  // ── WALLET NAVIGATION ──
  else if(a==='open-wallet'){pinBuf='';pinError='';go('walletLock',{walletLockFor:S.mid,walletChildMode:false});}
  else if(a==='back-routine'){go('routine');}
  else if(a==='back-wallet-lock'){go('routine');}
  else if(a==='wlt-cur'){go('wallet',{walletCur:el.dataset.c});}
  else if(a==='open-admin-wallet'){go('adminWallet');}
  else if(a==='back-admin-m'){go('adminmember');}
  // ── WALLET PIN ──
  else if(a==='pin-key'){
    if(pinBuf.length>=6)return;
    pinBuf+=el.dataset.n;
    pinError='';
    render();
    if(pinBuf.length===6){
      const pin=D.settings.walletPins&&D.settings.walletPins[S.walletLockFor];
      if(pinBuf===pin){
        pinBuf='';pinError='';
        go('wallet',{mid:S.walletLockFor,walletCur:'aud',walletChildMode:true});
      }else{
        pinBuf='';pinError='❌ Wrong PIN. Try again.';
        render();
      }
    }
  }
  else if(a==='pin-del'){pinBuf=pinBuf.slice(0,-1);pinError='';render();}
  else if(a==='pin-parent'){
    const pw=prompt('Enter parent password:');
    if(!pw)return;
    if(pw===D.settings.pw){
      pinBuf='';pinError='';
      // Parent gets full access via adminWallet
      go('adminWallet',{adminMid:S.walletLockFor});
    }else{alert('Incorrect password.');}
  }
  else if(a==='set-wallet-pin'){
    const m=D.members.find(x=>x.id===S.adminMid);
    const pin=prompt(`${m?m.name+'の':''}ウォレットPINを設定 (6 digits):`);
    if(!pin)return;
    if(!/^\d{6}$/.test(pin)){alert('6桁の数字を入力してください。');return;}
    D.settings.walletPins[S.adminMid]=pin;
    DB.save(D);
    alert(`PIN set for ${m?m.name:'member'} ✓`);
    render();
  }
  else if(a==='child-withdraw'){
    const cur=S.walletCur||'aud';
    const amtStr=prompt(`引き出す金額 (${cur.toUpperCase()})?`);
    if(!amtStr)return;
    const amt=parseFloat(amtStr);
    if(isNaN(amt)||amt<=0){alert('Invalid amount');return;}
    addTx(S.mid,cur,'withdrawal',-amt,'Withdrawal');
    render();
  }
  else if(a==='child-deposit'){
    const pw=prompt('親のパスワードを入力してください:');
    if(!pw)return;
    if(pw!==D.settings.pw){alert('パスワードが違います。');return;}
    const cur=S.walletCur||'aud';
    const amtStr=prompt(`追加する金額 (${cur.toUpperCase()})?`);
    if(!amtStr)return;
    const amt=parseFloat(amtStr);
    if(isNaN(amt)||amt<=0){alert('Invalid amount');return;}
    const note=prompt('メモ (任意):','')||'';
    const result=addTx(S.mid,cur,'deposit',amt,note);
    render();
    if(result==='goal_reached')celebrateGoal(S.mid);
  }
  // ── ALLOWANCE ACTIONS ──
  else if(a==='aw-deposit'){
    const cur=prompt('Currency? Type: aud  or  jpy','aud');
    if(!cur)return;
    const c=cur.toLowerCase().trim();
    if(c!=='aud'&&c!=='jpy'){alert('Please type aud or jpy');return;}
    const amtStr=prompt(`Amount (${c.toUpperCase()})?`);
    if(!amtStr)return;
    const amt=parseFloat(amtStr);
    if(isNaN(amt)||amt<=0){alert('Invalid amount');return;}
    const note=prompt('Note (optional):','')||'';
    const result=addTx(S.adminMid,c,'deposit',amt,note);
    render();
    if(result==='goal_reached')celebrateGoal(S.adminMid);
  }
  else if(a==='aw-withdraw'){
    const cur=prompt('Currency? aud or jpy','aud');
    if(!cur)return;
    const c=cur.toLowerCase().trim();
    if(c!=='aud'&&c!=='jpy'){alert('Please type aud or jpy');return;}
    const amtStr=prompt(`Amount to withdraw (${c.toUpperCase()})?`);
    if(!amtStr)return;
    const amt=parseFloat(amtStr);
    if(isNaN(amt)||amt<=0){alert('Invalid amount');return;}
    addTx(S.adminMid,c,'withdrawal',-amt,'Withdrawal');
    render();
  }
  else if(a==='aw-penalty'){
    const reason=prompt('Reason for penalty?','Bad language');
    if(!reason)return;
    const amtStr=prompt('Amount (AUD)?','0.50');
    const amt=parseFloat(amtStr);
    if(isNaN(amt)||amt<=0){alert('Invalid amount');return;}
    addTx(S.adminMid,'aud','penalty',-amt,reason);
    render();
    alert(`⚠️ $${amt.toFixed(2)} penalty applied.`);
  }
  else if(a==='aw-debt'){
    const cur=prompt('Currency? aud or jpy','aud');
    if(!cur)return;
    const c=cur.toLowerCase().trim();
    if(c!=='aud'&&c!=='jpy'){alert('Please type aud or jpy');return;}
    const amtStr=prompt(`Debt amount (${c.toUpperCase()})?`);
    if(!amtStr)return;
    const amt=parseFloat(amtStr);
    if(isNaN(amt)||amt<=0){alert('Invalid amount');return;}
    const reason=prompt('Reason?','Damage/breakage')||'Debt';
    const a2=DB_A.get();
    if(!a2[S.adminMid])a2[S.adminMid]={aud:ewallet(),jpy:ewallet()};
    a2[S.adminMid][c].debt+=amt;
    a2[S.adminMid][c].transactions.unshift({id:uid(),date:today(),type:'debt',amount:-amt,note:reason});
    DB_A.save(a2);
    render();
    alert(`🔴 $${amt} debt added. Will be deducted from future income.`);
  }
  else if(a==='aw-confirm'){
    const result=confirmWeek(S.adminMid);
    render();
    celebrate(S.adminMid);
    alert(`🏆 Week ${result.count} confirmed! $${result.bonus.toFixed(2)} AUD bonus added!`);
  }
  else if(a==='aw-event'){
    const cur=prompt('Currency? aud or jpy','aud');
    if(!cur)return;
    const c=cur.toLowerCase().trim();
    if(c!=='aud'&&c!=='jpy'){alert('Please type aud or jpy');return;}
    const amtStr=prompt(`Bonus amount (${c.toUpperCase()})?`);
    if(!amtStr)return;
    const amt=parseFloat(amtStr);
    if(isNaN(amt)||amt<=0){alert('Invalid amount');return;}
    const note=prompt('Event? (e.g. Award, Test A, Sports)','Award')||'Event';
    const result=addTx(S.adminMid,c,'event_bonus',amt,note);
    render();
    celebrate(S.adminMid);
    if(result==='goal_reached')celebrateGoal(S.adminMid);
  }
  else if(a==='aw-jplevel'){
    const amtStr=prompt('Japanese level bonus amount (AUD)?','0.50');
    if(!amtStr)return;
    const amt=parseFloat(amtStr);
    if(isNaN(amt)||amt<=0){alert('Invalid amount');return;}
    const note=prompt('Achievement?','Hiragana complete')||'Japanese Level';
    const result=addTx(S.adminMid,'aud','jp_bonus',amt,note);
    render();
    celebrate(S.adminMid);
    if(result==='goal_reached')celebrateGoal(S.adminMid);
  }
  else if(a==='aw-set-goal'){
    const desc=prompt('What are they saving for?');
    if(!desc)return;
    const amtStr=prompt('Target amount (AUD)?');
    if(!amtStr)return;
    const amt=parseFloat(amtStr);
    if(isNaN(amt)||amt<=0){alert('Invalid amount');return;}
    const a2=DB_A.get();
    if(!a2[S.adminMid])a2[S.adminMid]={aud:ewallet(),jpy:ewallet()};
    a2[S.adminMid].aud.goal={description:desc,amount:amt};
    DB_A.save(a2);render();
  }
  else if(a==='aw-clear-goal'){
    if(!confirm('Remove savings goal?'))return;
    const a2=DB_A.get();
    if(a2[S.adminMid])a2[S.adminMid].aud.goal=null;
    DB_A.save(a2);render();
  }
  else if(a==='aw-debt-ratio'){
    const cur=prompt('Which currency? aud or jpy','aud');
    if(!cur)return;
    const c=cur.toLowerCase().trim();
    const ratioStr=prompt('What % of each income goes to debt repayment?\n(e.g. 50 = 50%)','50');
    if(!ratioStr)return;
    const ratio=parseFloat(ratioStr)/100;
    if(isNaN(ratio)||ratio<=0||ratio>1){alert('Enter a number between 1-100');return;}
    const a2=DB_A.get();
    if(a2[S.adminMid])a2[S.adminMid][c].debtRatio=ratio;
    DB_A.save(a2);render();
  }
  else if(a==='aw-clear-debt'){
    if(!confirm('Clear all debt? (only do this if it has been paid off)'))return;
    const a2=DB_A.get();
    if(a2[S.adminMid]){a2[S.adminMid].aud.debt=0;a2[S.adminMid].jpy.debt=0;}
    DB_A.save(a2);render();
  }
  else if(a==='aw-interest'){
    if(!confirm('Apply 5% annual interest to AUD and JPY balances?'))return;
    const a2=DB_A.get();
    if(!a2[S.adminMid])a2[S.adminMid]={aud:ewallet(),jpy:ewallet()};
    const wA=a2[S.adminMid].aud,wJ=a2[S.adminMid].jpy;
    const intA=wA.balance*0.05,intJ=wJ.balance*0.05;
    if(intA>0){wA.balance+=intA;wA.transactions.unshift({id:uid(),date:today(),type:'interest',amount:intA,note:'Annual 5% interest'});}
    if(intJ>0){wJ.balance+=intJ;wJ.transactions.unshift({id:uid(),date:today(),type:'interest',amount:intJ,note:'Annual 5% interest'});}
    DB_A.save(a2);render();
    alert(`📈 Interest applied!\nAUD: +$${intA.toFixed(2)}\nJPY: +¥${Math.round(intJ)}`);
  }
  else if(a==='backup-export'){
    const json=exportBackup();
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(json).then(()=>{
        alert('✅ データをコピーしました！\nメモ帳やLINEのメッセージに貼り付けて保存してください。');
      }).catch(()=>{prompt('以下のテキストを全選択してコピーしてください：',json);});
    }else{
      prompt('以下のテキストを全選択してコピーしてください：',json);
    }
  }
  else if(a==='backup-import'){
    const json=prompt('バックアップデータを貼り付けてください：');
    if(!json)return;
    if(importBackup(json)){
      alert('✅ データを復元しました！アプリを再読み込みします。');
      loadData();render();
    }else{
      alert('❌ データの形式が正しくありません。もう一度確認してください。');
    }
  }
  else if(a==='dishes'){go('dishes');}
  else if(a==='addmember'){go('addmember');}
  else if(a==='chpw'){
    const np=prompt('Enter new password:');
    if(np&&np.trim()){D.settings.pw=np.trim();DB.save(D);alert('Password updated ✓');}
  }
  else if(a==='savedishes'){
    document.querySelectorAll('[data-a="dchange"]').forEach(sel=>{
      const d=sel.dataset.d;
      D.dishes[d]=Array.from(sel.selectedOptions).map(o=>o.value);
    });
    DB.save(D);go('settings');
  }
  else if(a==='pickemo'){
    document.querySelectorAll('.emo-btn').forEach(b=>{b.classList.remove('sel');b.style.background='var(--border)';});
    el.classList.add('sel');
  }
  else if(a==='pickcol'){
    document.querySelectorAll('.col-btn').forEach(b=>b.classList.remove('sel'));
    el.classList.add('sel');
  }
  else if(a==='savemember'){
    const nm=document.getElementById('mnm')?.value.trim();
    const ag=parseInt(document.getElementById('mag')?.value)||0;
    const emoBtn=document.querySelector('.emo-btn.sel');
    const colBtn=document.querySelector('.col-btn.sel');
    if(!nm){alert('Please enter a name.');return;}
    const newM={
      id:'m'+Date.now(),name:nm,age:ag,
      emoji:emoBtn?emoBtn.dataset.e:'⭐',
      color:colBtn?colBtn.dataset.c:'#667eea',
      ...(ag<=1?{isBaby:true}:ag>=2&&ag<=5?{isYoung:true}:{}),
    };
    D.members.push(newM);
    D.tasks[newM.id]=newM.isBaby?clone(EMPTY_TASKS):newM.isYoung?clone(YOUNG_DEFAULTS):clone(TASK_DEFAULTS);
    DB.save(D);go('settings');
  }
}

function handleKey(e){
  if(e.key==='Enter'&&S.screen==='login'){
    document.querySelector('[data-a="login"]')?.click();
  }
  if(S.screen==='walletLock'){
    if(/^[0-9]$/.test(e.key)){
      document.querySelector(`[data-a="pin-key"][data-n="${e.key}"]`)?.click();
    }else if(e.key==='Backspace'){
      document.querySelector('[data-a="pin-del"]')?.click();
    }
  }
}

function celebrateGoal(mid){
  const m=D.members.find(x=>x.id===mid)||{emoji:'🎯',name:''};
  const ov=document.createElement('div');
  ov.className='cel-ov';
  ov.innerHTML=`<div class="cel-card">
    <div class="cel-em">🎯</div>
    <div class="cel-t">Goal Reached!</div>
    <div class="cel-s">${m.name} reached their savings goal! ${m.emoji}<br>Time to celebrate! 🎉</div>
    <button class="btn-pri" style="margin-top:18px" onclick="this.closest('.cel-ov').remove()">Amazing! 🌟</button>
  </div>`;
  document.body.appendChild(ov);
  launchConfetti();
}

// ── CELEBRATION ───────────────────────────────────

function celebrate(mid){
  const m=D.members.find(x=>x.id===mid)||{emoji:'🎉',name:''};
  const ov=document.createElement('div');
  ov.className='cel-ov';
  ov.innerHTML=`<div class="cel-card">
    <div class="cel-em">🎉</div>
    <div class="cel-t">All Done!</div>
    <div class="cel-s">Amazing work, ${m.name}! ${m.emoji}<br>You completed all your tasks!</div>
    <button class="btn-pri" style="margin-top:18px" onclick="this.closest('.cel-ov').remove()">Awesome! 🌟</button>
  </div>`;
  document.body.appendChild(ov);
  launchConfetti();
}

function launchConfetti(){
  const cv=document.getElementById('confetti');
  cv.style.display='block';
  cv.width=window.innerWidth;
  cv.height=window.innerHeight;
  const ctx=cv.getContext('2d');
  const cols=['#FF6B6B','#4ECDC4','#45B7D1','#FFEAA7','#DDA0DD','#98D8C8','#FFB347','#87CEEB'];
  const parts=Array.from({length:90},()=>({
    x:Math.random()*cv.width,y:-20,
    vx:(Math.random()-.5)*4,vy:Math.random()*3+2,
    c:cols[Math.floor(Math.random()*cols.length)],
    sz:Math.random()*7+4,rot:Math.random()*360,rs:(Math.random()-.5)*8,
  }));
  let af;
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    let alive=false;
    parts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.rot+=p.rs;
      if(p.y<cv.height+20)alive=true;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.c;ctx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz);ctx.restore();
    });
    if(alive)af=requestAnimationFrame(draw);
    else{cv.style.display='none';cancelAnimationFrame(af);}
  }
  draw();
  setTimeout(()=>{cv.style.display='none';cancelAnimationFrame(af);},5000);
}

// ── STARTUP ───────────────────────────────────────

document.addEventListener('click',handleClick);
document.addEventListener('keydown',handleKey);

// handle dishes multi-select display update
document.addEventListener('change',e=>{
  const sel=e.target.closest('[data-a="dchange"]');
  if(!sel)return;
  const d=sel.dataset.d;
  const dp=document.getElementById('dp'+d);
  if(dp){
    const names=Array.from(sel.selectedOptions).map(o=>{
      const m=D.members.find(x=>x.id===o.value);return m?m.name:o.text;
    });
    dp.textContent=names.join(' + ')||'—';
  }
});

loadData();
render();
</script>
